name: poshaneye_auth
description: "PoshanEye role selection, sign in, and sign up Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  go_router: ^16.2.4
  flutter_riverpod: ^3.0.0
  flutter_animate: ^4.5.2
  camera: ^0.11.2
  image_picker: ^1.2.3
  video_player: ^2.14.0
  http: ^1.2.0

# Vendored fork of camera_android_camerax 0.6.30: binds ImageAnalysis only when a
# frame stream is actually used, fixing "No supported surface combination is found"
# on OPPO CPH2603 (ColorOS). See third_party/README.md.
dependency_overrides:
  camera_android_camerax:
    path: third_party/camera_android_camerax

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
