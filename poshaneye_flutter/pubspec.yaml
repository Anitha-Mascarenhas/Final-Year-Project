name: poshaneye
description: PoshanEye - AI-powered pediatric nutrition screening app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.66.2
  percent_indicator: ^4.2.3
  camera: ^0.11.0+2
  http: ^1.2.1
  path: ^1.9.0
  video_player: ^2.8.6
  file_picker: ^8.1.3  # >=8 required: 6.x uses the removed v1 Android embedding (Registrar) and breaks the build
  intl: ^0.19.0
  image: ^4.2.0  # offline JPEG/PNG decode for on-device hybrid inference
  # On-device TFLite runners for the production hybrid pipeline:
  # hybrid_production_image_feature_extractor.tflite ([1,224,224,3] -> [1,128])
  # hybrid_production_segmentation.tflite ([1,512,512,3] -> [1,512,512,2])
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/cheetah.mp4
    - assets/videos/albatross.mp4
    - assets/videos/shark.mp4
    # Production hybrid inference (do NOT deploy the legacy best_model.tflite):
    # image feature extractor (TFLite) + preprocessing params + portable RBF-SVM + labels
    - assets/models/hybrid_production_image_feature_extractor.tflite
    - assets/models/hybrid_production_segmentation.tflite
    - assets/models/hybrid_production_preprocessor.json
    - assets/models/hybrid_production_svm_portable.json
    - assets/models/hybrid_production_label_map.json
